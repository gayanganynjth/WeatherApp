<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="App.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="App.js"></script>
</head>
<body>

    <div class="card">
        <div class="search">
            <input id="cityInput" type="text" placeholder="enter city name" spellcheck="false">
            <button onclick="search()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="weather">
            <img id="weather-icon" >
            <h1 id="temp"></h1>
            <h2 id="city-name"></h2>
        </div>

        <div class="details">
            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/727/727790.png" alt="humidity">
                <div>
                    <p id="humidity"></p>
                    <p class="labels">Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/1585/1585392.png" alt="wind">
                <div>
                    <p id="wind"></p>
                    <p class="labels">Wind Speed</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
